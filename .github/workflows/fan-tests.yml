name: Fan feedback tests

on:
  pull_request:
    branches: [master]
    paths:
      - custom_components/smartir/**
      - codes/fan/1221.json
      - tests/**
      - .github/workflows/fan-tests.yml
  push:
    branches: [master]
    paths:
      - custom_components/smartir/**
      - codes/fan/1221.json
      - tests/**
      - .github/workflows/fan-tests.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tests/requirements.txt
      - run: python -m pip install -r tests/requirements.txt
      - run: python -m pytest -q tests
